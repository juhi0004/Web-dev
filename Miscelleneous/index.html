<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get and post requests</title>
</head>
<body>
    <h3>GET request Form</h3>
    <form method="get" action="https://localhost:3000/register">
        <input placeholder="enter username" name="user" type="text"/>
        <input placeholder="enter password" name="password" type="password"/>
        <button>submit</button>
    </form>
     <h3>POST request Form</h3>
    <form method="post" action="https://localhost:3000/register">
        <input placeholder="enter username" name="user" type="text"/>
        <input placeholder="enter password" name="password" type="password"/>
        <button>submit</button>
    </form>
</body>
</html>
